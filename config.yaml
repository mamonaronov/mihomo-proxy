proxy-groups:
  # Real Bot API: GET /bot is 404 JSON. 200/301/302 matches DPI redirects.
  # Provider health-checks still use gstatic for general liveness.
  # FREE drops nodes that look fast on Google/DPI but cannot carry Bot API.
  - name: FREE
    type: url-test
    use:
      - "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Полная • Full | VLESS"
      - "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Полная • Full | SS, Hy2, Vmess, Trojan"
      - "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Mobile-150"
      - "🏳️ БЕЛЫЕ СПИСКИ 🏳️ WHITE LISTS | CIDR | Полная • Full"
      - "🏳️ БЕЛЫЕ СПИСКИ 🏳️ WHITE LISTS | SNI-RU"
    url: https://api.telegram.org/bot
    interval: 30
    timeout: 4000
    tolerance: 100
    lazy: false
    max-failed-times: 1
    expected-status: 404
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅|Anycast"

  # paid-begin
  # Every paid node is health-checked every minute, including while FREE is up.
  - name: PAID
    type: url-test
    use:
      - "Платная"
    url: https://api.telegram.org/bot
    interval: 60
    timeout: 4000
    tolerance: 100
    lazy: false
    max-failed-times: 1
    expected-status: 404
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅|Anycast"
  # paid-end

  # First alive wins. Bots and MATCH stay on AUTO.
  - name: AUTO
    type: fallback
    proxies:
      - FREE
      # paid-begin
      - PAID
      # paid-end
    url: https://api.telegram.org/bot
    expected-status: 404
    interval: 30
    timeout: 4000
    lazy: false
    max-failed-times: 1

  - name: SUBSCRIBE
    type: fallback
    proxies:
      - DIRECT
      - AUTO
    # Same host family as provider URLs. Bot API would make DIRECT always fail
    # in RU, so every pull would go through the tunnel.
    url: https://github.com/favicon.ico
    expected-status: 200/204/301/302
    interval: 300
    timeout: 4000
    lazy: false
    max-failed-times: 1

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - DIRECT

rules:
  - MATCH,AUTO

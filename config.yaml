# Mihomo (Clash Meta) — SOCKS for Telegram bots in Docker.
# Schema only: subscription URLs and API secret come from .env
# (${SUB1_URL} … ${SUB5_URL}, ${PAID_URL}, ${MIHOMO_API_SECRET}) via entrypoint envsubst.
# Do not publish mixed-port / API. Host v2rayN keeps 10808/10809.
#
# Update schema: commit yaml, git pull, docker compose restart
# Update subscription URL: edit .env, docker compose up -d  (no yaml commit)
#
# Provider key and node prefix are the subscription profile-title.
# Cache files stay ./providers/subN.yaml. If SUBn_URL changes, update that title too.
# FREE = url-test of the five free subscriptions.
# PAID = url-test of the limited paid plan (${PAID_URL}). Optional.
# Empty PAID_URL: entrypoint drops the marked paid blocks, and AUTO keeps only FREE.
# Set PAID_URL: paid carries traffic only when FREE is down.
# No FAST/BACKUP/WHITELIST groups.
# Region exclude is off — Anycast and expire rows only. Bot API health: HTTP 404.
# Providers use SUBSCRIBE: DIRECT first, AUTO if GitHub is blocked.
# Do not point providers at AUTO alone — deadlock when the tunnel is down.
# Cached provider YAML still works if both DIRECT and AUTO fail.

mixed-port: 11808
bind-address: "*"
allow-lan: true
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: false
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false

external-controller: 0.0.0.0:19090
secret: "${MIHOMO_API_SECRET}"

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  # SOCKS bots need real IPs. fake-ip is for TUN on a laptop.
  enhanced-mode: redir-host
  # IP-literal DoH: no UDP/53 bootstrap, so RU hijack cannot poison dns.google.
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - https://8.8.4.4/dns-query
  fallback-filter:
    geoip: false

proxy-providers:
  "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Полная • Full | VLESS":
    type: http
    url: "${SUB1_URL}"
    path: ./providers/sub1.yaml
    interval: 900
    size-limit: 10485760
    proxy: SUBSCRIBE
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 4000
      lazy: true
      expected-status: 204
    override:
      additional-prefix: "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Полная • Full | VLESS | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  "🏴 ЧЕРНЫЕ СПИСКИ 🏴 BLACK LISTS | Полная • Full | SS, Hy2, Vmess, Trojan":

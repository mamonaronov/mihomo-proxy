services:
  mihomo:
    build: .
    # Local name only. Base image tag lives in Dockerfile FROM.
    image: mihomo-proxy
    container_name: mihomo-proxy
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/etc/mihomo
      # Base image VOLUME /root/.config/mihomo would otherwise create
      # an anonymous Docker volume under /var/lib/docker/volumes.
      - ./data:/root/.config/mihomo
      # Overlay the baked-in template so schema edits do not need --build.
      - ./config.yaml:/template/config.yaml:ro
    networks:
      telegram-proxy:
        aliases:
          - proxy
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

networks:
  telegram-proxy:
    name: telegram-proxy
